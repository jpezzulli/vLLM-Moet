id: deepseek-v4-flash/pro6000x1-mapped-w2-dspark4-300k
model: DeepSeek-V4-Flash-0731
served_name: pennyroyal
summary: "1x RTX PRO 6000 - mapped DSpark W2 layers 43-45, DSpark-4, 6 GiB target FP4, 300K admission"

requires:
  gpus: 1
  vram_gb: 96
  host_ram_gb: 192

context: 300000
load_timeout_s: 2400

# Performance-oriented sibling of pro6000x1-mapped-w2-dspark4. Hardware
# exercised with 378,490 runtime-reported KV tokens and an exact 250,000-token
# uncached prefill. All target W2 layers remain GPU-resident; the mapped DSpark
# layers are excluded from the target-only FP4 correction pool.
env:
  VLLM_USE_V2_MODEL_RUNNER: "1"
  VLLM_USE_BREAKABLE_CUDAGRAPH: "0"
  VLLM_USE_DEEP_GEMM: "1"
  VLLM_MOE_W2: "1"
  VLLM_MOE_W2_FORCE_RESIDENT: "1"
  VLLM_MOE_W2_DELTA_GB: "6"
  VLLM_MOE_W2_DELTA_RESERVE_GB: "0"
  VLLM_MOE_W2_DELTA_EXCLUDE_LAYERS: "43,44,45"
  VLLM_MOE_W2_DRAFT: "1"
  VLLM_MOE_W2_NUM_LAYERS: "46"
  VLLM_MOE_W2_DELTA_POLICY: "freq"
  VLLM_MOE_W2_PREFILL_FP4: "1"
  VLLM_MOE_W2_GATE: "0"
  VLLM_MOE_W2_AFRAG: "1"
  VLLM_MOE_W2_FUSED_UNPERMUTE: "0"
  VLLM_MOE_W2_MAPPED_LAYERS: "43,44,45"

serve_args:
  - --host 0.0.0.0
  - --tensor-parallel-size 1
  - --max-model-len 300000
  - --max-num-seqs 4
  - --kv-cache-dtype fp8
  - --block-size 256
  - --gpu-memory-utilization 0.974
  - --max-num-batched-tokens 2048
  - --enable-prefix-caching
  - --trust-remote-code
  - --load-format safetensors
  - --tokenizer-mode deepseek_v4
  - --reasoning-parser deepseek_v4
  - --default-chat-template-kwargs {"enable_thinking":true,"reasoning_effort":"high"}
  - --override-generation-config {"top_p":0.95}
  - --enable-auto-tool-choice
  - --tool-call-parser deepseek_v4
  - --speculative-config {"method":"dspark","num_speculative_tokens":4,"draft_sample_method":"greedy"}
  - --compilation-config {"cudagraph_mode":"FULL_AND_PIECEWISE","custom_ops":["all"]}

warmup:
  decode_requests: 1

suite_params:
  batch_decode:
    concurrency: [1]
